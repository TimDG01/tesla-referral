<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph image source (1200x630)</title>
<!--
  Source for img/og.png, the social-sharing preview.
  Not part of the site itself - nothing links to this file.
  Regenerate after changing the referral code, e.g.:

    chrome --headless --window-size=1200,630 --hide-scrollbars \
           --screenshot=img/og.png tools/og-image.html
-->
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:
 radial-gradient(70% 70% at 50% 0%, rgba(232,33,39,.20), transparent 70%),
 linear-gradient(180deg,#101318,#0d0f12);
 color:#e8ebef;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{color:#e82127;font-size:26px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:74px;line-height:1.06;letter-spacing:-.02em;margin:22px 0 0;max-width:15ch}
.code{margin-top:30px;display:inline-flex;align-items:center;gap:22px;background:#171b21;
 border:1px solid #262c35;border-radius:20px;padding:22px 34px;align-self:flex-start}
.code span{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:44px;color:#fff}
.code small{font-size:22px;color:#8b98a8;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
img{width:420px}
.foot{color:#8b98a8;font-size:24px}
</style></head><body>
<div>
  <div class="eyebrow">Tesla referral · Belgium</div>
  <h1>Tesla referral code</h1>
  <div class="code"><small>Code</small><span>tim588947</span></div>
</div>
<div class="row">
  <div class="foot">Apply it before you confirm your order —<br>it costs you nothing.</div>
  <img src="../img/hero-car.svg">
</div>
</body></html>
