<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img" aria-labelledby="heroCarTitle">
  <title id="heroCarTitle">Illustration of an electric car plugged in at a charge point</title>
  <defs>
    <radialGradient id="hcGlow" cx="50%" cy="76%" r="52%">
      <stop offset="0" stop-color="#e82127" stop-opacity=".20"/>
      <stop offset="1" stop-color="#e82127" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hcBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#414b59"/>
      <stop offset="1" stop-color="#1b2027"/>
    </linearGradient>
    <linearGradient id="hcGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77869a"/>
      <stop offset="1" stop-color="#39424f"/>
    </linearGradient>
  </defs>

  <ellipse cx="215" cy="154" rx="190" ry="40" fill="url(#hcGlow)"/>

  <g fill="#39424f" opacity=".5">
    <circle cx="52" cy="34" r="1.6"/><circle cx="118" cy="22" r="1.2"/><circle cx="196" cy="30" r="1.6"/>
    <circle cx="286" cy="20" r="1.2"/><circle cx="352" cy="38" r="1.6"/><circle cx="392" cy="60" r="1.2"/>
  </g>

  <!-- charge point -->
  <rect x="26" y="72" width="26" height="76" rx="8" fill="#1b2027" stroke="#39424f" stroke-width="2"/>
  <path d="M41 86l-9 14h7l-3 12 10-15h-7z" fill="#e82127"/>
  <path d="M52 126c16 8 14 6 26 8" fill="none" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>

  <!-- car body -->
  <path d="M78 132c-4-12 4-20 18-23l32-7c18-18 40-26 77-26 35 0 57 8 75 25l42 9c16 4 24 10 24 22v6c0 4-3 6-8 6H86c-5 0-8-2-8-6z" fill="url(#hcBody)"/>
  <path d="M137 100c15-13 33-19 66-19 29 0 49 7 65 19z" fill="url(#hcGlass)" opacity=".9"/>
  <path d="M203 81v19" stroke="#1b2027" stroke-width="2.5"/>
  <path d="M160 112v14M228 112v14" stroke="#2c343f" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <path d="M152 112h84" stroke="#2c343f" stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <!-- lights, tucked inside the body -->
  <rect x="324" y="116" width="18" height="7" rx="3.5" fill="#ffd9a0" opacity=".92"/>
  <rect x="84" y="120" width="14" height="6" rx="3" fill="#e82127" opacity=".9"/>

  <!-- wheels -->
  <circle cx="126" cy="146" r="20" fill="#0d0f12" stroke="#39424f" stroke-width="3"/>
  <circle cx="126" cy="146" r="8" fill="#39424f"/>
  <circle cx="302" cy="146" r="20" fill="#0d0f12" stroke="#39424f" stroke-width="3"/>
  <circle cx="302" cy="146" r="8" fill="#39424f"/>

  <path d="M8 167h404" stroke="#262c35" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 179h58M132 179h58M224 179h58M316 179h58" stroke="#262c35" stroke-width="3" stroke-linecap="round" opacity=".55"/>
</svg>
